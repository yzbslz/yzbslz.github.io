<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>yzbslz</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://yzbslz.netlify.app/">
<meta http-equiv="refresh" content="1.6; url=https://yzbslz.netlify.app/">
<style>
  :root{ --ink:#f3f6ff; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#05070d;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  /* 壁纸层：缓慢呼吸缩放，避免看起来像一张静态截图 */
  body::after{
    content:"";
    position:fixed;inset:-3%;
    background:url("https://t.tutu.to/img/pWUs") center/cover no-repeat;
    z-index:-1;
    animation:breathe 22s ease-in-out infinite alternate;
  }
  @keyframes breathe{from{transform:scale(1)}to{transform:scale(1.055)}}
  /* 压暗层：任何壁纸下文字都清楚 */
  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(115% 85% at 50% 42%, rgba(5,7,13,.28), rgba(5,7,13,.74) 68%, rgba(5,7,13,.90)),
      linear-gradient(180deg, rgba(5,7,13,.5), rgba(5,7,13,.68));
    z-index:-1;
  }

  .stage{
    position:relative;z-index:1;
    text-align:center;
    padding:0 28px;
    transform:translateY(-2vh);
  }
  h1{
    font-size:clamp(30px,9vw,46px);
    font-weight:600;
    letter-spacing:.16em;
    text-indent:.16em;
    text-shadow:0 2px 28px rgba(0,0,0,.6);
  }
  .tag{
    margin-top:12px;
    font-size:11px;
    letter-spacing:.42em;
    text-indent:.42em;
    color:rgba(243,246,255,.66);
  }
  .bar{
    width:132px;height:1px;
    margin:28px auto 0;
    background:rgba(255,255,255,.2);
    overflow:hidden;
  }
  .bar i{
    display:block;height:100%;width:100%;
    background:rgba(255,255,255,.92);
    transform:scaleX(0);transform-origin:left;
    animation:fill 1.6s linear forwards;
  }
  @keyframes fill{to{transform:scaleX(1)}}

  .enter{
    display:inline-block;
    margin-top:24px;
    font-size:12px;letter-spacing:.18em;text-indent:.18em;
    color:rgba(243,246,255,.92);
    text-decoration:none;
    padding:9px 18px 8px;
    border:1px solid rgba(255,255,255,.28);
    border-radius:2px;
    background:rgba(255,255,255,.05);
    transition:background .25s,border-color .25s;
  }
  .enter:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55)}

  .host{
    position:fixed;left:0;right:0;bottom:18px;z-index:1;
    text-align:center;
    font-size:10px;letter-spacing:.24em;text-indent:.24em;
    color:rgba(243,246,255,.42);
  }

  @media (prefers-reduced-motion: reduce){
    body::after{animation:none}
    .bar i{animation-duration:.01s}
  }
</style>
</head>
<body>
  <div class="stage">
    <h1>yzbslz</h1>
    <p class="tag">MUSIC · 个人主页</p>
    <div class="bar"><i></i></div>
    <a class="enter" href="https://yzbslz.netlify.app/">直接进入</a>
  </div>
  <p class="host">YZBSLZ.NETLIFY.APP</p>

<script>
  setTimeout(function(){ location.replace("https://yzbslz.netlify.app/"); }, 1650);
</script>
</body>
</html>
