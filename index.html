<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>yzbslz</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://yzbslz.netlify.app/">
<noscript><meta http-equiv="refresh" content="2; url=https://yzbslz.netlify.app/"></noscript>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#e9eff8;
    background-image:
      radial-gradient(120% 90% at 18% 12%, #fbfdff 0%, rgba(251,253,255,0) 58%),
      radial-gradient(110% 95% at 84% 92%, #cddced 0%, rgba(205,220,237,0) 62%),
      linear-gradient(168deg,#eef4fb 0%,#e3ecf6 46%,#d6e3f1 100%);
    color:#17233c;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* 一圈很淡的内边框，像卡片，不像模板 */
  .frame{
    position:fixed;inset:14px;z-index:0;
    border:1px solid rgba(23,35,60,.09);
    pointer-events:none;
  }

  .stage{
    position:relative;z-index:1;
    width:100%;text-align:center;
    padding:0 26px;
    transform:translateY(-1.5vh);
  }
  h1{
    font-size:clamp(34px,9.4vw,52px);
    font-weight:600;letter-spacing:.16em;text-indent:.16em;
    color:#16233c;
  }
  .tag{
    margin-top:14px;
    font-size:10.5px;letter-spacing:.46em;text-indent:.46em;
    color:rgba(23,35,60,.55);
  }
  .bar{
    width:112px;height:1px;margin:30px auto 0;
    background:rgba(23,35,60,.14);overflow:hidden;
  }
  .bar i{
    display:block;height:100%;width:100%;
    background:rgba(23,35,60,.62);
    transform:scaleX(0);transform-origin:left;
    animation:fill 1.25s linear forwards;
  }
  @keyframes fill{to{transform:scaleX(1)}}
  .enter{
    display:inline-block;margin-top:26px;
    font-size:12px;letter-spacing:.16em;text-indent:.16em;
    color:rgba(23,35,60,.78);text-decoration:none;
    padding-bottom:3px;
    border-bottom:1px solid rgba(23,35,60,.26);
    transition:color .25s,border-color .25s;
  }
  .enter:hover,.enter:active{color:#0d1830;border-color:rgba(23,35,60,.8)}

  .host{
    position:fixed;left:0;right:0;bottom:30px;z-index:1;
    text-align:center;
    font-size:9.5px;letter-spacing:.28em;text-indent:.28em;
    color:rgba(23,35,60,.30);
  }
  @media (max-height:520px){
    .stage{transform:none}
    .host{bottom:20px}
  }
</style>
</head>
<body>
  <div class="frame"></div>

  <div class="stage">
    <h1>yzbslz</h1>
    <p class="tag">MUSIC · 个人主页</p>
    <div class="bar"><i></i></div>
    <a class="enter" href="https://yzbslz.netlify.app/">直接进入</a>
  </div>
  <p class="host">YZBSLZ.NETLIFY.APP</p>

<script>
(function(){
  var TARGET = "https://yzbslz.netlify.app/";
  var PREVIEW = /preview/.test(location.search) || /preview/.test(location.hash);
  var leaving = false;

  function go(delay){
    if (PREVIEW || leaving) return;
    leaving = true;
    setTimeout(function(){ location.replace(TARGET); }, delay || 0);
  }

  go(1300);
})();
</script>
</body>
</html>
