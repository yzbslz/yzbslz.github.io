<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>yzbslz</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://yzbslz.netlify.app/">
<link rel="preload" as="image" href="https://t.tutu.to/img/pWUs">
<noscript><meta http-equiv="refresh" content="2; url=https://yzbslz.netlify.app/"></noscript>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#dfe7f2;
    color:#17233c;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    overflow:hidden;
    display:flex;align-items:flex-end;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* 壁纸 */
  #wall{
    position:fixed;inset:-2%;z-index:-2;
    background:url("https://t.tutu.to/img/pWUs") center 30%/cover no-repeat;
    opacity:0;transition:opacity 1s ease;
    animation:breathe 26s ease-in-out infinite alternate;
  }
  #wall.on{opacity:1}
  @keyframes breathe{from{transform:scale(1)}to{transform:scale(1.035)}}

  /* 底部一层淡白，让字压在浅色区，不抢画面 */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      linear-gradient(to top, rgba(247,250,255,.94) 0%, rgba(247,250,255,.72) 22%, rgba(247,250,255,.22) 46%, rgba(247,250,255,0) 66%),
      linear-gradient(to bottom, rgba(247,250,255,.20), rgba(247,250,255,0) 26%);
  }

  .stage{
    position:relative;z-index:1;
    width:100%;text-align:center;
    padding:0 26px 11vh;
  }
  h1{
    font-size:clamp(30px,8.6vw,44px);
    font-weight:600;letter-spacing:.15em;text-indent:.15em;
    color:#16233c;
  }
  .tag{
    margin-top:11px;
    font-size:10.5px;letter-spacing:.44em;text-indent:.44em;
    color:rgba(23,35,60,.5);
  }
  .bar{
    width:120px;height:1px;margin:26px auto 0;
    background:rgba(23,35,60,.18);overflow:hidden;
  }
  .bar i{
    display:block;height:100%;width:100%;
    background:rgba(23,35,60,.55);
    transform:scaleX(0);transform-origin:left;
    transition:transform 1.5s linear;
  }
  .enter{
    display:inline-block;margin-top:22px;
    font-size:12px;letter-spacing:.16em;text-indent:.16em;
    color:rgba(23,35,60,.82);text-decoration:none;
    padding-bottom:3px;
    border-bottom:1px solid rgba(23,35,60,.3);
    transition:color .25s,border-color .25s;
  }
  .enter:hover{color:#0d1830;border-color:rgba(23,35,60,.8)}

  .host{
    position:fixed;left:0;right:0;bottom:14px;z-index:1;
    text-align:center;
    font-size:9.5px;letter-spacing:.26em;text-indent:.26em;
    color:rgba(23,35,60,.34);
  }
</style>
</head>
<body>
  <div id="wall"></div>

  <div class="stage">
    <h1>yzbslz</h1>
    <p class="tag">MUSIC · 个人主页</p>
    <div class="bar"><i id="fill"></i></div>
    <a class="enter" href="https://yzbslz.netlify.app/">直接进入</a>
  </div>
  <p class="host">YZBSLZ.NETLIFY.APP</p>

<script>
(function(){
  var TARGET = "https://yzbslz.netlify.app/";
  var wall = document.getElementById("wall");
  var bar  = document.getElementById("fill");
  var loaded = false, leaving = false;
  var PREVIEW = /preview/.test(location.search) || /preview/.test(location.hash);

  function paint(){ wall.classList.add("on"); bar.style.transform = "scaleX(1)"; }
  function go(){
    if (PREVIEW) return;
    if (leaving) return;
    leaving = true;
    setTimeout(function(){ location.replace(TARGET); }, 900);
  }

  var img = new Image();
  img.onload  = function(){ loaded = true; paint(); setTimeout(go, 1150); };
  img.onerror = function(){ setTimeout(go, 500); };
  img.src = "https://t.tutu.to/img/pWUs";

  setTimeout(function(){ if(!loaded) paint(); }, 250);
  setTimeout(go, 3300);
})();
</script>
</body>
</html>
